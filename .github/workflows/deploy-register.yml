name: Deploy Practical Register (Cloudflare)

# Runs on GitHub's servers, which can reach Cloudflare. Needs three repository secrets:
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, REGISTER_SETUP_KEY. Without them the job stops quietly.
on:
  workflow_dispatch:
  push:
    branches: [claude/awesome-bohr-6nyqlq]
    paths: ['practical-cloudflare/**', '.github/workflows/deploy-register.yml']

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practical-cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      REGISTER_SETUP_KEY: ${{ secrets.REGISTER_SETUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: guard
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ "${#REGISTER_SETUP_KEY}" -lt 12 ]; then
            echo "Secrets missing (or REGISTER_SETUP_KEY shorter than 12 characters). Skipping deploy."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.go == 'yes'
        with:
          node-version: 20
      - name: Install
        if: steps.guard.outputs.go == 'yes'
        run: npm ci
      - name: Find or create the D1 database
        if: steps.guard.outputs.go == 'yes'
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(x=>x.name==="srs-practical-register");console.log(r?r.uuid:"")})')
          if [ -z "$ID" ]; then
            npx wrangler d1 create srs-practical-register
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(x=>x.name==="srs-practical-register");console.log(r?r.uuid:"")})')
          fi
          test -n "$ID"
          sed -i "s/PUT-YOUR-D1-DATABASE-ID-HERE/$ID/" wrangler.jsonc
      - name: Create tables and photo bucket
        if: steps.guard.outputs.go == 'yes'
        run: |
          npx wrangler d1 execute srs-practical-register --remote --file=schema.sql
          npx wrangler r2 bucket create srs-practical-photos || echo "bucket exists or already created"
      - name: Deploy
        if: steps.guard.outputs.go == 'yes'
        run: |
          npx wrangler deploy
          printf '%s' "$REGISTER_SETUP_KEY" | npx wrangler secret put REGISTER_SETUP_KEY
